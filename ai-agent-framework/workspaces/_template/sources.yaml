# sources.yaml — các nguồn dữ liệu. KHÔNG ghi mật khẩu ở đây: dùng ${TEN_BIEN} và đặt giá trị trong .env.
# ${WORKSPACE_DIR} = đường dẫn tuyệt đối tới thư mục workspace này.
#
# Luôn dùng TÀI KHOẢN DATABASE CHỈ CÓ QUYỀN ĐỌC. Guard SQL trong code chỉ là lớp bảo vệ thứ hai.

sources:
  # --- PostgreSQL (pip install "bizagent[postgres]")
  sales:
    type: sql
    url: "postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-localhost}:${DB_PORT:-5432}/${DB_NAME}"
    description: "Dữ liệu bán hàng"
    allowed_tables: ["public.*"]      # bảng agent được đọc: "schema.table", có ký tự đại diện *
    default_schema: public
    max_rows: 200                     # số dòng tối đa trả cho agent mỗi câu
    timeout_seconds: 15
    mask_columns: ["phone", "email", "address"]   # cột bị che trước khi tới AI

