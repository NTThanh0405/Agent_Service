# docker compose up -d --build                       -> REST API + trang chat ở http://127.0.0.1:8000
# docker compose --profile telegram up -d --build    -> thêm bot Telegram
# Cần .env (chép từ .env.example) có BIZAGENT_API_TOKEN và API key của model.

services:
  api:
    build: .
    env_file: .env
    environment:
      - BIZAGENT_WORKSPACE=${BIZAGENT_WORKSPACE:-demo}
    ports:
      - "127.0.0.1:8000:8000"          # chỉ mở trên máy chủ; ra Internet thì đặt sau reverse proxy / tunnel có HTTPS
    volumes:
      - ./workspaces:/app/workspaces     # sửa workspace trên máy chủ, restart để nạp lại
    extra_hosts:
      - "host.docker.internal:host-gateway"   # database trên chính máy chủ: DB_HOST=host.docker.internal
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1g

  telegram:
    profiles: ["telegram"]
    build: .
    env_file: .env
    environment:
      - BIZAGENT_WORKSPACE=${BIZAGENT_WORKSPACE:-demo}
    command: ["bizagent", "telegram"]
    volumes:
      - ./workspaces:/app/workspaces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1g
