<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --accent:#2563eb; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b22; --text:#e5e7eb; --muted:#9ca3af; --accent:#60a5fa; --border:#2a2f3a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; gap:8px; align-items:center; }
  header h1 { font-size:16px; margin:0; flex:1; }
  header input { width:200px; padding:6px 8px; border:1px solid var(--border); border-radius:6px;
                 background:var(--card); color:var(--text); }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:min(760px, 92%); padding:10px 14px; border-radius:10px; white-space:pre-wrap; }
  .me { align-self:flex-end; background:var(--accent); color:#fff; }
  .bot { align-self:flex-start; background:var(--card); border:1px solid var(--border); }
  .muted { color:var(--muted); font-style:italic; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border); }
  textarea { flex:1; resize:none; height:48px; padding:10px; border-radius:8px; border:1px solid var(--border);
             background:var(--card); color:var(--text); font:inherit; }
  button { padding:0 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <h1>{{TITLE}}</h1>
  <input id="token" type="password" placeholder="API token (nếu có)" autocomplete="off">
  <button id="new" type="button">Cuộc mới</button>
</header>
<div id="log"></div>
<form id="f">
  <textarea id="q" placeholder="Hỏi về dữ liệu, ví dụ: doanh thu tuần này so với tuần trước?"></textarea>
  <button id="send">Gửi</button>
</form>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), send = document.getElementById('send');
const tokenInput = document.getElementById('token');
let thread = 'web-' + Math.random().toString(36).slice(2, 10);
function add(text, cls) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
document.getElementById('new').onclick = () => { thread = 'web-' + Math.random().toString(36).slice(2, 10); log.innerHTML = ''; };
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('f').requestSubmit(); } });
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return;
  add(text, 'me'); q.value = ''; send.disabled = true;
  const wait = add('Đang phân tích…', 'bot muted');
  try {
    const headers = { 'Content-Type': 'application/json' };
    if (tokenInput.value) headers['Authorization'] = 'Bearer ' + tokenInput.value;
    const r = await fetch('/api/v1/chat', { method: 'POST', headers, body: JSON.stringify({ message: text, thread_id: thread }) });
    const data = await r.json();
    wait.className = 'msg bot'; wait.textContent = r.ok ? data.answer : ('Lỗi: ' + (data.detail || r.status));
  } catch (err) { wait.className = 'msg bot'; wait.textContent = 'Lỗi kết nối: ' + err; }
  send.disabled = false; q.focus();
};
</script>
</body>
</html>
