# bizagent — bản Linux (Docker). Hướng dẫn: README.md, mục "Bản Linux (Docker)".
#
#   ./deploy/docker/setup.sh                       # lần đầu: tạo .env (sinh khoá bí mật), quyền thư mục
#   docker compose up -d --build                   # web + bot Telegram + tác vụ nền: http://127.0.0.1:8000
#   docker compose --profile https up -d           # + Caddy: HTTPS tự động cho BIZAGENT_DOMAIN
#   docker compose --profile tunnel up -d          # + Cloudflare Tunnel (không cần mở cổng)
#
# Dữ liệu (state DB, kho DuckDB, file xuất Power BI) nằm trong ./workspaces/<ten>/data trên máy chủ.

services:
  bizagent:
    build:
      context: .
      args:
        EXTRAS: ${BIZAGENT_EXTRAS:-llm-all,postgres,mysql,telegram,gsheets,excel,mcp}
        MSSQL: ${BIZAGENT_MSSQL:-0}
    image: bizagent:local
    env_file: .env
    environment:
      BIZAGENT_WORKSPACE: ${BIZAGENT_WORKSPACE:-demo}
      BIZAGENT_BEHIND_PROXY: "1"
    user: "${BIZAGENT_UID:-1000}:${BIZAGENT_GID:-1000}"   # trùng chủ sở hữu ./workspaces trên máy chủ
    ports:
      - "127.0.0.1:${BIZAGENT_PORT:-8000}:8000"          # chỉ mở trên máy chủ; ra ngoài qua Caddy hoặc Tunnel
    volumes:
      - ./workspaces:/app/workspaces
    extra_hosts:
      - "host.docker.internal:host-gateway"              # database trên chính máy chủ: DB_HOST=host.docker.internal
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: ${BIZAGENT_MEM_LIMIT:-2g}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  caddy:
    profiles: ["https"]
    image: caddy:2.8-alpine
    depends_on: [bizagent]
    environment:
      BIZAGENT_DOMAIN: ${BIZAGENT_DOMAIN:-}            # bắt buộc khi dùng profile https
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:-latest}
    depends_on: [bizagent]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}   # bắt buộc khi dùng profile tunnel
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
