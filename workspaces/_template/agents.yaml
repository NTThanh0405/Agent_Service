# agents.yaml — model AI và giới hạn của agent.
# Model viết dạng "provider:model". Provider: anthropic (claude), openai (chatgpt), google_genai (gemini),
# deepseek, ollama, azure_openai, groq, mistralai, bedrock. Cài gói tương ứng: pip install "bizagent[openai]"...
# API key đặt trong .env: ANTHROPIC_API_KEY, OPENAI_API_KEY, GOOGLE_API_KEY, DEEPSEEK_API_KEY...

default_model: anthropic:claude-sonnet-5-5

# Tên gọi tắt, dùng ở agent.model bên dưới
models:
  fast: anthropic:claude-haiku-5-5
  # gpt: openai:<ten-model>
  # gemini: google_genai:<ten-model>
  # deepseek: deepseek:<ten-model>
  # local:                            # mọi API tương thích OpenAI: vLLM, LM Studio, OpenRouter...
  #   provider: openai
  #   model: <ten-model>
  #   base_url: http://localhost:1234/v1
  #   api_key_env: LOCAL_LLM_KEY

agent:
  model: default          # "default", tên gọi tắt ở trên, hoặc "provider:model"
  max_steps: 12           # số vòng gọi tool tối đa mỗi câu hỏi
  timeout_seconds: 120
  max_tokens: 3000
  temperature: null       # để null; một số model (vd Claude đời mới) từ chối temperature

# Nhiều agent chuyên trách (docs/AGENTS.md): router chọn đường -> analyst lấy số liệu -> advisor đánh giá, đề xuất;
# designer lo dashboard. Mục nào để trống thì lấy theo `agent` ở trên.
multi_agent:
  enabled: false          # true = bật; false = một agent như cũ
  router:   {model: fast}             # model rẻ: chỉ chọn đường, không gọi tool. enabled: false = bỏ router
  analyst:  {model: default, max_steps: 12}   # truy vấn dữ liệu: nên dùng model mạnh nhất
  advisor:  {model: default}          # đánh giá + đề xuất từ số liệu analyst đã lấy. enabled: false = không đề xuất
  designer: {enabled: true}           # tạo / tìm dashboard. false = analyst tự làm

limits:                   # chống quá tải và chống tốn tiền API ngoài ý muốn
  max_concurrent: 8       # số câu hỏi xử lý cùng lúc (câu sau chờ tới lượt)
  per_user_per_minute: 10 # số câu hỏi tối đa mỗi người mỗi phút (0 = không giới hạn)
  daily_tokens_per_user: 0   # tổng token vào + ra mỗi người mỗi ngày (0 = không giới hạn), vd 500000
  exempt_roles: []        # role không bị giới hạn, vd [admin]
