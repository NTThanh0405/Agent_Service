name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # một bản Python lỗi vẫn chạy hết các bản còn lại, để thấy lỗi ở đâu
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,anthropic,telegram,excel,mcp]"
      - run: ruff check bizagent tests
      - run: pytest -q -rfE
